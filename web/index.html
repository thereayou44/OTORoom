<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>OTO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="entry">

    <header class="entry__head">
        <span class="mark__dot"></span>
        <span class="mark__name">oto</span>
    </header>

    <section class="card">

        <div class="preview" id="preview" data-state="loading">
            <video id="previewVideo" autoplay playsinline muted></video>
            <div class="preview__fallback" id="previewFallback">Разреши доступ к камере</div>
            <div class="meter" aria-hidden="true"><i id="meterFill"></i></div>
            <span class="preview__state" id="checkState">ждём доступ</span>
        </div>

        <div class="devices">
            <select id="camSelect" aria-label="Камера"><option value="">Камера по умолчанию</option></select>
            <select id="micSelect" aria-label="Микрофон"><option value="">Микрофон по умолчанию</option></select>
        </div>

        <div class="toggles">
            <button type="button" class="toggle" id="camToggle" aria-pressed="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2.5" y="6" width="13" height="12" rx="2.5"/>
                    <path d="M15.5 11l5-3.2v8.4l-5-3.2z"/>
                </svg>
                Камера
            </button>
            <button type="button" class="toggle" id="micToggle" aria-pressed="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="9.5" y="3" width="5" height="10" rx="2.5"/>
                    <path d="M6 11a6 6 0 0 0 12 0M12 17v4"/>
                </svg>
                Микрофон
            </button>
        </div>

        <div class="field">
            <label for="room">Комната</label>
            <input id="room" type="text" placeholder="algo-lesson" autocomplete="off"
                   spellcheck="false" inputmode="latin" maxlength="32">
        </div>

        <button class="enter" id="enter">Войти</button>

        <p class="hint">Латиница, цифры и дефис. Кто откроет ту же ссылку — попадёт сюда же.</p>

        <div class="notice" id="notice" hidden></div>

    </section>

</main>

<script src="lobby.js"></script>
</body>
</html>
